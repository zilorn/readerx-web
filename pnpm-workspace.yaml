# 构建脚本白名单（两代 pnpm 的键名都写上，谁读谁认）：
# - pnpm 11（本机）：allowBuilds
# - pnpm 10（Cloudflare 构建镜像默认，如 10.11.1）：onlyBuiltDependencies
#
# packages 字段必须保留：pnpm 10 一旦看到本文件就要求它非空
# （否则报错 "packages field missing or empty"，Cloudflare 构建会直接失败）。
packages:
  - "."

allowBuilds:
  esbuild: true
  workerd: true

onlyBuiltDependencies:
  - esbuild
  - workerd
